# Docker-specific configuration
spring:
  datasource:
    url: jdbc:postgresql://postgres-carts:5432/bakery_carts
    username: cart_user
    password: cart_password
  jpa:
    show-sql: false
  data:
    redis:
      host: redis-carts
      port: 6379

# Eureka Configuration for Docker
eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    prefer-ip-address: true
    hostname: cart-service

# Server Configuration
server:
  port: 8084

# Logging for Docker
logging:
  level:
    com.blubugtech.bakery_cart_service: INFO
    org.springframework.web: WARN
    org.hibernate.SQL: WARN
    root: INFO
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
